<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Student Grade Calculator</h1>
        <p class="subtitle">Enter your scores below to calculate your final grade.</p>

        <form id="gradeForm">
            <div class="input-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter your name" required>
            </div>

            <div class="input-group">
                <label for="quiz">Quiz Score (20%):</label>
                <input type="number" id="quiz" min="0" max="100" placeholder="0 - 100" required>
            </div>

            <div class="input-group">
                <label for="assignment">Assignment Score (20%):</label>
                <input type="number" id="assignment" min="0" max="100" placeholder="0 - 100" required>
            </div>

            <div class="input-group">
                <label for="midterm">Midterm Exam (25%):</label>
                <input type="number" id="midterm" min="0" max="100" placeholder="0 - 100" required>
            </div>

            <div class="input-group">
                <label for="final">Final Exam (35%):</label>
                <input type="number" id="final" min="0" max="100" placeholder="0 - 100" required>
            </div>

            <button type="submit">Calculate Grade</button>
        </form>

        <div id="result" class="result hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
